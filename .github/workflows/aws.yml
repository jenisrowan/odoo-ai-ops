name: Build & Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      apply_infra:
        description: "Run full 'terraform apply' (rolling deploy of all services)"
        type: boolean
        default: true

env:
  AWS_REGION: ap-south-1
  ODOO_ECR_REPOSITORY: odoo-custom
  NGINX_ECR_REPOSITORY: nginx-custom
  FASTAPI_ECR_REPOSITORY: fastapi-agent
  CLICKHOUSE_ECR_REPOSITORY: clickhouse-custom

# id-token: write is required for OIDC role assumption.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build images & deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"

      - name: Setup QEMU (for arm64 agent image)
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -input=false

      # Create just the ECR repositories first so we have somewhere to push.
      - name: Bootstrap ECR repositories
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve -input=false \
            -target=module.ecr \
            -var="odoo_image_url=bootstrap" \
            -var="nginx_image_url=bootstrap" \
            -var="fastapi_image_url=bootstrap"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # All ECS hosts are Graviton (c6g/m6g/r6g) -> every image is built arm64.
      - name: Build & push Odoo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: templates/Dockerfile.odoo
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ODOO_ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=odoo
          cache-to: type=gha,mode=max,scope=odoo

      - name: Build & push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: templates/Dockerfile.nginx
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.NGINX_ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Build & push FastAPI agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: templates/Dockerfile.fastapi
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.FASTAPI_ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=fastapi
          cache-to: type=gha,mode=max,scope=fastapi

      - name: Build & push ClickHouse image (S3 tiered-storage config)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: templates/Dockerfile.clickhouse
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.CLICKHOUSE_ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=clickhouse
          cache-to: type=gha,mode=max,scope=clickhouse

      # Log groups are retained across a teardown (skip_destroy), so after a
      # destroy they exist in CloudWatch but not in state and CreateLogGroup
      # would fail with ResourceAlreadyExistsException. Adopt whatever is
      # actually there; already-managed groups are skipped, and a group that
      # doesn't exist yet is simply created by the apply below.
      #
      # Existence is checked against CloudWatch first, so a failed import is
      # never mistaken for an absent group. That distinction matters: if an
      # import breaks (permissions, throttling, a bad address) the apply below
      # is guaranteed to die on ResourceAlreadyExistsException, so fail here
      # instead - with the reason - rather than 20 minutes later without it.
      - name: Adopt retained CloudWatch log groups
        if: ${{ inputs.apply_infra }}
        working-directory: ./terraform
        run: |
          set -euo pipefail
          managed="$(terraform state list)"
          failed=0
          adopt() {
            addr="$1"; name="$2"
            if grep -qxF "$addr" <<<"$managed"; then
              echo "already managed: $addr"
              return 0
            fi
            # describe-log-groups matches on prefix, so re-filter for the exact
            # name (/ecs/odoo must not match /ecs/odoo-something). An AWS-side
            # failure here aborts the step via set -e rather than being read as
            # "absent".
            found="$(aws logs describe-log-groups --log-group-name-prefix "$name" \
              --query "logGroups[?logGroupName=='$name'].logGroupName" --output text)"
            if [ "$found" != "$name" ]; then
              echo "no existing log group $name - the apply will create it"
              return 0
            fi
            if terraform import -input=false -lock-timeout=5m "$addr" "$name"; then
              echo "adopted existing log group: $name"
            else
              echo "::error::log group $name exists but could not be imported into $addr"
              failed=1
            fi
          }
          adopt module.ecs.aws_cloudwatch_log_group.odoo_logs            /ecs/odoo
          adopt module.ecs.aws_cloudwatch_log_group.fastapi_logs         /ecs/fastapi
          adopt module.telemetry.aws_cloudwatch_log_group.clickhouse     /ecs/clickhouse
          adopt module.telemetry.aws_cloudwatch_log_group.langfuse       /ecs/langfuse
          adopt module.webhooks.aws_cloudwatch_log_group.webhook_lambda  /aws/lambda/odoo-webhook-authorizer
          adopt module.webhooks.aws_cloudwatch_log_group.apigw_access    /aws/apigateway/odoo-webhooks
          exit "$failed"

      # Full apply rolls out new task-definition revisions referencing the new
      # image tags -> ECS performs a rolling deployment for each service.
      - name: Terraform Apply (rolling deploy)
        if: ${{ inputs.apply_infra }}
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve -input=false \
            -var="odoo_image_url=${{ steps.login-ecr.outputs.registry }}/${{ env.ODOO_ECR_REPOSITORY }}:${{ github.sha }}" \
            -var="nginx_image_url=${{ steps.login-ecr.outputs.registry }}/${{ env.NGINX_ECR_REPOSITORY }}:${{ github.sha }}" \
            -var="fastapi_image_url=${{ steps.login-ecr.outputs.registry }}/${{ env.FASTAPI_ECR_REPOSITORY }}:${{ github.sha }}" \
            -var="clickhouse_image_url=${{ steps.login-ecr.outputs.registry }}/${{ env.CLICKHOUSE_ECR_REPOSITORY }}:${{ github.sha }}"

      # Belt-and-suspenders: force a new deployment in case only the image
      # tag changed and the service didn't otherwise re-deploy.
      - name: Force ECS rolling deployments
        if: ${{ inputs.apply_infra }}
        run: |
          for svc in odoo-service fastapi-service clickhouse-service langfuse-service; do
            aws ecs update-service --cluster odoo-cluster --service "$svc" --force-new-deployment >/dev/null
          done
